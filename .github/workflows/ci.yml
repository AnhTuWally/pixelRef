name: CI

# Runs on pull requests and pushes to main. It has no access to any secret and only read permission:
# pull requests (including from forks) must never be able to reach the release key.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.16"
          cache: pip
      - name: System libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 libpulse0 libpulse-mainloop-glib0
      - run: python -m pip install -r requirements.txt
      # test_workflows parses the workflow files with PyYAML, which is not an app dependency.
      - run: python -m pip install pyyaml
      # The update system must pass on every platform it will be released for.
      - name: Update system tests
        run: python tests/run_tests.py test_update test_workflows
      # The whole suite. Four tests already failed before the update work (test_effects x2,
      # test_plugin_security activity monitor, test_docs MCP scene tools which needs pytest's tmp_path),
      # so this step reports but does not block until they are fixed. Remove continue-on-error then.
      - name: Full test suite
        continue-on-error: true
        run: python tests/run_tests.py
